# Render Blueprint: the Strapi CMS on Render's free plan, backed by Neon PostgreSQL.
# The Next.js app (apps/web) is deployed on Vercel. See README "Deploy for free".
services:
  - type: web
    name: lerevenu-cms
    runtime: docker
    plan: free
    # Same AWS region as the Neon project (eu-central-1), to keep query latency low.
    region: frankfurt
    rootDir: apps/cms
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_health
    # CD: redeploy on every push to main, once the GitHub Actions checks have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_CLIENT
        value: postgres
      # Neon *direct* connection string (host without "-pooler"): Strapi runs schema
      # migrations at boot and keeps its own connection pool.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      # Neon scales to zero: let idle connections go instead of holding them open.
      - key: DATABASE_POOL_MIN
        value: "0"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: APP_KEYS
        generateValue: true
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Seeds the demo data and the admin account on start (both idempotent).
      # Set to "false" once the first deploy is live: it shortens cold starts.
      - key: SEED_ON_START
        value: "true"
      - key: SEED_USER_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
